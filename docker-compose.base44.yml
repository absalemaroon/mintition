services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      # Vite-style host allow not needed; Next uses allowedDevOrigins in config
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "corepack enable pnpm && pnpm install --frozen-lockfile && exec npx next dev -H 0.0.0.0 -p 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
